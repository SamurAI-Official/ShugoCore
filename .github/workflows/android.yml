name: Android release APK

# Builds the single self-determining APK (all arm64 CPU kernel variants shipped
# in one file; each device picks its own at startup) and attaches the signed
# artifact to a GitHub release.
#
# Prerequisites (configured once, stored as repo secrets):
#   ANDROID_KEYSTORE_BASE64    - the release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  - keystore password
#   ANDROID_KEY_ALIAS          - signing key alias
#   ANDROID_KEY_PASSWORD       - signing key password
#
# Usage:
#   gh release create v1.30.1 --generate-notes   # then the workflow runs
#   or trigger manually: gh workflow run android.yml --ref v1.30.1

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    name: Build + sign release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply the NRR patch series
        # The parent repo records only the submodule's commit; the Android
        # build needs the local fixes (e.g. the Windows-only windows.h
        # include in runtime/onnx_runtime.cpp) that live in patches/nrr/.
        run: bash scripts/apply_nrr_patches.sh

      - name: Set up JDK (JetBrains Runtime 21)
        # The Gradle daemon is pinned by gradle-daemon-jvm.properties to
        # toolchainVendor=jetbrains / toolchainVersion=21 (the Android Studio
        # runtime), so the CI JDK must match exactly.
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Set up Android SDK + NDK + CMake
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -e
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Non-interactive license acceptance (the action's `tools` package
          # no longer exists in the SDK repo and aborts the run).
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.0.12077973" "cmake;3.22.1" \
                     "platforms;android-34" "build-tools;34.0.0" | tail -3
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Restore ONNX Runtime (gitignored)
        run: bash scripts/fetch_ort_android.sh 1.23.2 arm64-v8a x86_64

      - name: Restore the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shugocore-release.jks"
          echo "SHUGOCORE_KEYSTORE_FILE=$RUNNER_TEMP/shugocore-release.jks" >> "$GITHUB_ENV"

      - name: Set up Python 3.13 (Chaquopy build interpreter)
        # Chaquopy's buildPython must match the target runtime version, which
        # this app bundles as Python 3.13; the runner's default python3 is
        # older and the build rejects it.
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build + sign the release APK
        env:
          SHUGOCORE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SHUGOCORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SHUGOCORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -f platforms/android/gradlew
          cd platforms/android
          ./gradlew :app:assembleRelease --console=plain --stacktrace

      - name: Name the APK after the tag
        run: |
          test -f platforms/android/app/build/outputs/apk/release/app-release.apk
          NAME="shugocore-${GITHUB_REF_NAME#v}.apk"
          cp platforms/android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_PATH=$NAME" >> "$GITHUB_ENV"

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="shugocore-${GITHUB_REF_NAME#v}.apk"
          # A tag push does not create a GitHub release, so create it if the
          # tag has none (auto-generated notes; refine with `gh release edit`).
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
              gh release create "$GITHUB_REF_NAME" \
                  --title "ShugoCore ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$NAME" --clobber
          echo "Uploaded $NAME to $GITHUB_REF_NAME"

      - name: Upload as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_PATH }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
