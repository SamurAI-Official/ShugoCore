name: Android release APK

# Builds the single self-determining APK (all arm64 CPU kernel variants shipped
# in one file; each device picks its own at startup) and attaches the signed
# artifact to a GitHub release.
#
# Prerequisites (configured once, stored as repo secrets):
#   ANDROID_KEYSTORE_BASE64    - the release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  - keystore password
#   ANDROID_KEY_ALIAS          - signing key alias
#   ANDROID_KEY_PASSWORD       - signing key password
#
# Usage:
#   gh release create v1.30.1 --generate-notes   # then the workflow runs
#   or trigger manually: gh workflow run android.yml --ref v1.30.1

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    name: Build + sign release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK + CMake
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -e
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Non-interactive license acceptance (the action's `tools` package
          # no longer exists in the SDK repo and aborts the run).
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.0.12077973" "cmake;3.22.1" \
                     "platforms;android-34" "build-tools;34.0.0" | tail -3
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Restore ONNX Runtime (gitignored)
        run: bash scripts/fetch_ort_android.sh 1.23.2 arm64-v8a x86_64

      - name: Restore the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shugocore-release.jks"
          echo "SHUGOCORE_KEYSTORE_FILE=$RUNNER_TEMP/shugocore-release.jks" >> "$GITHUB_ENV"

      - name: Build + sign the release APK
        env:
          SHUGOCORE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SHUGOCORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SHUGOCORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -f platforms/android/gradlew
          cd platforms/android
          ./gradlew :app:assembleRelease --console=plain --stacktrace

      - name: Name the APK after the tag
        run: |
          test -f platforms/android/app/build/outputs/apk/release/app-release.apk
          NAME="shugocore-${GITHUB_REF_NAME#v}.apk"
          cp platforms/android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_PATH=$NAME" >> "$GITHUB_ENV"

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$APK_PATH" --clobber
          echo "Uploaded $APK_PATH to $GITHUB_REF_NAME"

      - name: Upload as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_PATH }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
