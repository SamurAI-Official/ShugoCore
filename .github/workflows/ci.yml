name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Long-lived work branches can be reviewed on demand without opening a PR
  # first: `gh workflow run ci.yml --ref hotfix/...`
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One interpreter failing must not cancel the other four. The matrix is
      # how we see *which* versions break — fail-fast hid 3.10-3.13 behind the
      # 3.9 leg (a single `@dataclass(slots=True)`) for three weeks.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Provide the NRR submodule + its patch series
        # The port-wiring and XR-descriptor tests read the vendored NRR tree
        # (include/nrr.h, runtime/onnx_runtime.cpp, engine_plugins/godot/...) and
        # assert the patch series still applies to the pinned SHA. Only NRR is
        # fetched: `submodules: recursive` would also clone the whole llama.cpp
        # history on all five matrix legs. This mirrors the Android workflow,
        # which builds against exactly this tree.
        run: |
          git submodule update --init platforms/android/app/src/main/cpp/nrr
          bash scripts/apply_nrr_patches.sh
      - name: Install dependencies
        # ``.[dev]`` adds the optional deps the suite exercises for real
        # (numpy / psycopg2-binary / opentelemetry-api). With only
        # requirements.txt installed, those tests errored on the runner while
        # passing locally.
        run: |
          pip install -r requirements.txt
          pip install '.[dev]'
      - name: Byte-compile all modules
        run: python -m compileall -q .
      - name: Run security & integration tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install 'ruff>=0.6'
      - name: Ruff (syntax errors + undefined names)
        run: ruff check .

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install 'bandit>=1.7'
      - name: Bandit - high severity (blocking)
        run: >-
          bandit -q -r .
          -x ./.venv,./.llama_build,./platforms,./dist,./build,./tests
          -lll
      - name: Bandit - medium severity (advisory)
        continue-on-error: true
        run: >-
          bandit -q -r .
          -x ./.venv,./.llama_build,./platforms,./dist,./build,./tests
          -ll

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory DB can flag unfixed vulns; keep CI green while visible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --no-deps || pip-audit -r requirements.txt
