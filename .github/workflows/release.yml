name: Release

# D4 + D5 (v1.30.4): trusted (OIDC) PyPI publishing, SBOM generation, and
# Sigstore artifact signing. There is NO static PyPI token anywhere —
# publishing goes through OpenID Connect token exchange with the
# `pypi` environment's trusted publisher, and every artifact gets a
# sigstore signature + a cyclonedx SBOM attached to the GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Trusted publishing authenticates by OIDC token exchange -- and the same token
  # signs the PEP 740 provenance that `attestations: true` below asks for. Without
  # `attestations: write` the publish step is refused when it writes the
  # attestation back, whatever the PyPI publisher config says.
  id-token: write
  attestations: write

jobs:
  publish-python:
    runs-on: ubuntu-latest
    # The PyPI trusted publisher is configured on the `pypi` environment
    # (repository owner SamurAI-Official, project shugocore).
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          # setuptools never prunes ``build/lib``, so a warm working tree can
          # re-pack a previous build's ``__pycache__`` into the wheel (73 .pyc
          # / 1.28 MB measured locally: a 950 KB wheel where a clean build is
          # 340 KB). Runners are fresh; clean anyway so the published artifact
          # is always byte-for-byte what the sources produce.
          rm -rf build dist attestations
          mkdir -p attestations
          pip install --upgrade build
          python -m build --sdist --wheel --outdir dist
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          # Not `dist/`: the publish step below scans that directory for
          # distributions and rejects anything else ("InvalidDistribution:
          # Unknown distribution format"). The SBOM is evidence *about* the
          # release, not part of it.
          output-file: ./attestations/shugocore-sbom.spdx.json
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: ./dist/*
      # Sigstore writes each bundle next to the file it signed, which puts
      # `*.whl.sigstore.json` into the one directory the publish step trusts.
      # `twine check` refuses it there -- "Unknown distribution format" -- and the
      # release dies after building and signing cleanly. Only distributions may
      # remain in `dist/`; everything else is evidence, and evidence belongs in
      # `attestations/`, which is what gets attached to the GitHub release.
      - name: Keep only distributions in the publish directory
        run: |
          find dist -maxdepth 1 -type f ! -name '*.whl' ! -name '*.tar.gz' \
            -exec mv {} attestations/ \;
          ls -1 dist attestations
      - name: Publish to PyPI (trusted / OIDC, no static token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
      - name: Attach SBOM + signatures to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          # `.sigstore.json`, not `.sigstore`: the earlier pattern matched
          # nothing, so the release shipped without the signatures that the
          # signing step had just paid to produce.
          files: |
            attestations/*.spdx.json
            attestations/*.pem
            attestations/*.sigstore.json
