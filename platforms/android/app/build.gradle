plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace "com.samurai.shugocore"
    compileSdk 34

    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.samurai.shugocore"
        minSdk 28
        targetSdk 34
        versionCode 19
        versionName "1.30.2"

        ndk {
            // arm64-v8a: 2020+ devices; x86_64: emulator testing
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // CRITICAL: force an optimized native build. Gradle's debug
                // variant otherwise injects CMAKE_BUILD_TYPE=Debug (-O0) into
                // the llama.cpp/ggml numerical kernels, which runs ~20-50x
                // slower (measured: 0.65 tok/s decode, 273s prefill for a
                // 0.5B Q4 model vs ~10 tok/s / seconds with -O3). Java-side
                // debuggability of the debug APK is unaffected.
                arguments "-DANDROID_STL=c++_shared", "-DCMAKE_BUILD_TYPE=Release",
                          // Runtime-selectable arm64 CPU kernel variants: one APK
                          // that self-determines dotprod/i8mm/sve vs the portable
                          // baseline on each device (see cpp/CMakeLists.txt).
                          "-DSHUGOCORE_CPU_VARIANTS=" +
                                  (project.hasProperty("shugocore.singlearch") ? "OFF" : "ON"),
                          // Only meaningful with SHUGOCORE_CPU_VARIANTS=OFF: forces
                          // armv8.2-a+dotprod baseline kernels, which SIGILL on
                          // arm64 CPUs without FEAT_DotProd.
                          "-DSHUGOCORE_ARM_DOTPROD=" +
                                  (project.hasProperty("shugocore.dotprod") ? "ON" : "OFF")
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    // The NRR model ships as an asset but must be readable at a real
    // filesystem path by ONNX Runtime, so NRRBridge extracts it into
    // filesDir. Keeping .onnx uncompressed means assets.openFd() reports its
    // true length (so the extraction can be skipped when already current) and
    // avoids an in-memory decompression of the whole graph.
    androidResources {
        noCompress 'onnx'
    }
    signingConfigs {
        release {
            // Key material comes from the environment so nothing secret is ever
            // committed. CI decodes the keystore from the ANDROID_KEYSTORE_BASE64
            // secret and exports the four SHUGOCORE_KEYSTORE_* variables; a
            // local release build exports the same four variables.
            def ksFile = System.getenv("SHUGOCORE_KEYSTORE_FILE")
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv("SHUGOCORE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SHUGOCORE_KEY_ALIAS")
                keyPassword System.getenv("SHUGOCORE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed only when key material is supplied (CI, or a local
            // export); otherwise the release build stays unsigned and the
            // debug key remains the fallback for local testing.
            if (System.getenv("SHUGOCORE_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            // Extract native libraries into the app's lib directory instead of
            // mapping them straight out of the APK.
            //
            // ggml discovers its CPU backend variants by enumerating
            // nativeLibraryDir and dlopen()ing each libggml-cpu-*.so path
            // (ggml_backend_load_best). With useLegacyPackaging=false those
            // files exist only inside the APK, so that directory is empty, no
            // CPU backend registers and llama fails with "no backends are
            // loaded" (verified on-device against the A51). Extraction makes
            // the directory real, the variants discoverable, and the runtime
            // CPU feature scoring selects the correct kernel set.
            useLegacyPackaging true
        }
    }

    // ONNX Runtime for the NRR native runtime. The .so files are extracted
    // from the official Maven AAR by scripts/fetch_ort_android.sh (gitignored)
    // and packaged straight from source, so there is no separate Maven
    // dependency and the CMake link target and the APK payload are the same
    // file. One AAR is ~19-23 MB per ABI; only the filtered ABIs ship.
    sourceSets {
        main {
            jniLibs.srcDirs += 'src/main/cpp/onnxruntime/lib'
        }
    }
}

chaquopy {
    defaultConfig {
        buildPython "python3"
        version "3.13"
        pip {
            // NOTE: the shugocore package itself is deliberately NOT pip-installed
            // here. A pinned "shugocore==x.y.z" resolves the prebuilt wheel in
            // ../../dist, which silently shadows the bundled (and kept-in-sync)
            // src/main/python tree with stale code - the DECIDE/RECORD semantics
            // fix shipped in the APK but the device kept executing the old 1.8.1
            // wheel. The bundled tree covers the entire on-device import graph
            // (robotics/mobile/shugonet handlers degrade via try/except).
            install "requests"
            install "numpy"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    // CameraX (v1.13 Vision): lifecycle-aware capture for the person-presence
    // provider. The only camera dependency; detection itself stays on the
    // platform FaceDetector (zero ML / Play-services deps).
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
}