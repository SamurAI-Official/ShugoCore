apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.samurai.shugocore"
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName "1.8.0"

        ndk {
            // arm64-v8a: 2020+ devices; x86_64: emulator testing
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.18.0"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

chaquopy {
    python {
        // Resolves python3 on PATH (macOS/Linux CI) — override per-machine via
        // local.properties: chaquopy.buildPython=/path/to/python3
        buildPython "python3"
        
        pip {
            dependencies += [
                "shugocore==1.8.0",
                "requests",
                "numpy"
            ]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.chaquo.python:python:12.4.0'
}