plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace "com.samurai.shugocore"
    compileSdk 34

    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.samurai.shugocore"
        minSdk 28
        targetSdk 34
        versionCode 13
        versionName "1.20.0"

        ndk {
            // arm64-v8a: 2020+ devices; x86_64: emulator testing
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // CRITICAL: force an optimized native build. Gradle's debug
                // variant otherwise injects CMAKE_BUILD_TYPE=Debug (-O0) into
                // the llama.cpp/ggml numerical kernels, which runs ~20-50x
                // slower (measured: 0.65 tok/s decode, 273s prefill for a
                // 0.5B Q4 model vs ~10 tok/s / seconds with -O3). Java-side
                // debuggability of the debug APK is unaffected.
                arguments "-DANDROID_STL=c++_shared", "-DCMAKE_BUILD_TYPE=Release"
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

chaquopy {
    defaultConfig {
        buildPython "python3"
        version "3.13"
        pip {
            // NOTE: the shugocore package itself is deliberately NOT pip-installed
            // here. A pinned "shugocore==x.y.z" resolves the prebuilt wheel in
            // ../../dist, which silently shadows the bundled (and kept-in-sync)
            // src/main/python tree with stale code - the DECIDE/RECORD semantics
            // fix shipped in the APK but the device kept executing the old 1.8.1
            // wheel. The bundled tree covers the entire on-device import graph
            // (robotics/mobile/shugonet handlers degrade via try/except).
            install "requests"
            install "numpy"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    // CameraX (v1.13 Vision): lifecycle-aware capture for the person-presence
    // provider. The only camera dependency; detection itself stays on the
    // platform FaceDetector (zero ML / Play-services deps).
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
}