[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shugocore"
version = "1.30.27"
description = "A continuous orchestration layer for synthetic functional agency: multi-model decisions, tool execution, four-tier memory, deterministic safety interlocks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SamurAI-Official" }]
keywords = ["agent", "orchestration", "memory", "autonomy", "safety"]
dependencies = ["requests>=2.32.0"]

[project.optional-dependencies]
torch = ["torch"]
chromadb = ["chromadb"]
telemetry = ["opentelemetry-api>=1.20"]
termux = ["websocket-client>=1.6"]
shogunet = ["shugonet>=0.1.0"]
postgres = ["psycopg2-binary>=2.9"]
simulation = ["mujoco>=3.0", "numpy>=1.24"]
# ``sandbox`` is what the shipped ``shugocore-actuation-sandbox`` tool needs for the
# TLS half of its containment proof: a real certificate, and a CA the client trusts
# through REQUESTS_CA_BUNDLE. Nothing in the runtime imports ``cryptography`` -- only
# the sandbox does -- so it belongs in an extra rather than in ``dependencies``. It
# was absent everywhere, which surfaced as two *errors* on CI (the sandbox's own TLS
# test and the scenario it belongs to) instead of as the tests running.
sandbox = ["cryptography>=41"]
# ``dev`` is the toolchain CI installs (see .github/workflows/ci.yml). It
# carries the optional dependencies the *suite* genuinely exercises — numpy
# arrays (simulation), real psycopg2.sql identifier composition (postgres) and
# OTel span plumbing (telemetry). Installing only requirements.txt left those
# paths erroring on CI while passing locally, where the venv happened to have
# them: a "works on my machine" gap, not a code bug.
dev = ["pytest", "ruff>=0.6", "bandit>=1.7",
       "numpy>=1.24", "psycopg2-binary>=2.9", "opentelemetry-api>=1.20",
       "cryptography>=41"]

[project.scripts]
shugocore-verify-audit = "audit:cli_main"
shugocore-server = "shugocore_server:main"
# Operator tools, each of which already exposes main(argv=None) -> int. Shipping
# them as entry points is what makes the published wheel as capable as the tree:
# the capability baseline and fleet onboarding are the two things an operator
# reaches for first, and neither was reachable from an installed package before.
shugocore-capability-matrix = "capability_matrix:main"
shugocore-claim-matrix = "claim_matrix:main"
shugocore-onboard = "fleet_onboard:main"
shugocore-actuation-sandbox = "actuation_sandbox:main"

[tool.setuptools]
packages = ["benchmarks", "conversation", "kv_mesh", "nrr", "personality",
            "prompts", "simulation", "sound", "subsystems"]
py-modules = ["acceleration", "actuation_sandbox", "agent_runtime", "android_bridge", "android_inference",
              "android_model_manager", "android_node", "android_runtime", "attention_layer", "audit",
              "autonomy", "capabilities", "capability_matrix", "check_apk", "claim_matrix",
              "continuous_agent", "decision_engine", "delegation", "dev_tasks", "execution_layer", "fallbacks",
              "fleet_deploy", "fleet_onboard", "gazebo_simulation", "gguf_meta", "human_interaction",
              "logging_manager", "memory_system", "mesh_election", "mesh_model_host", "mesh_rpc",
              "mobile_nodes", "model_backends", "model_manager", "moveit_planner", "node_identity",
              "persona", "pg_memory", "policy", "py_compat", "reinforcement_learning",
              "response_routing", "robotics_handler", "ros2_interface", "security",
              "security_inventory", "shugonet_bridge", "shugocore_agent", "shugocore_server",
              "state_machine", "state_paths", "subconscious", "talker", "task_manager", "telemetry", "token_budget",
              "vector_db", "version"]

[tool.ruff]
line-length = 100
target-version = "py39"
# Vendored C++ trees, Android build outputs and virtualenvs are not ours.
extend-exclude = [".venv", ".llama_build", "platforms", "dist", "build",
                  "*.egg-info", "shugocore.egg-info"]

[tool.ruff.lint]
# Blocking gate: syntax errors (E9) and undefined names (F821). These are real
# bugs, not style -- the F821 rule alone caught three broken code paths
# (audit.py logger, the KV transport adapter's protocol imports, and
# shugocore_agent.nrr_status_json's missing json import).
select = ["E9", "F821"]

[tool.ruff.lint.per-file-ignores]
# smoke_part_*.py are fragments concatenated into a larger smoke script (see
# tests/smoke_part_main.py), not standalone modules -- names intentionally
# come from sibling fragments and the files are not collected by unittest.
"tests/smoke_part_*.py" = ["F821"]