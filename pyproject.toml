[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shugocore"
version = "1.8.1"
description = "A continuous orchestration layer for synthetic functional agency: multi-model decisions, tool execution, four-tier memory, deterministic safety interlocks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SamurAI-Official" }]
keywords = ["agent", "orchestration", "memory", "autonomy", "safety"]
dependencies = ["requests>=2.32.0"]

[project.optional-dependencies]
torch = ["torch"]
chromadb = ["chromadb"]
telemetry = ["opentelemetry-api>=1.20"]
termux = ["websocket-client>=1.6"]
shogunet = ["shugonet>=0.1.0"]
postgres = ["psycopg2-binary>=2.9"]
simulation = ["mujoco>=3.0", "numpy>=1.24"]

[project.scripts]
shugocore-verify-audit = "audit:cli_main"
shugocore-server = "shugocore_server:main"

[tool.setuptools]
py-modules = ["acceleration", "android_bridge", "android_inference", "android_node",
              "android_runtime", "audit", "autonomy", "continuous_agent",
              "decision_engine", "execution_layer", "fallbacks",
              "gazebo_simulation", "logging_manager", "memory_system",
              "mobile_nodes", "model_backends", "model_manager",
              "moveit_planner", "pg_memory", "policy",
              "reinforcement_learning",
              "robotics_handler", "ros2_interface", "security",
              "shugonet_bridge", "shugocore_agent", "shugocore_server", "state_machine", "subconscious",
              "task_manager", "telemetry", "token_budget", "vector_db",
              "version"]